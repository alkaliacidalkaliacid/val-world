<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>THE ASHEN DOMINION — Cover System (Green / Black Geometric)</title>
<style>
  :root{
    --green:#2fe07a; --green-dim:#15924c; --green-deep:#0a3520; --pale:#c9ffe0;
    --ink:#000; --paper:#0b0d0c;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:#101211; color:#e8f5ec; font-family:"Helvetica Neue", Arial, sans-serif; padding:28px;}
  h1.page{font-size:15px; letter-spacing:.35em; color:var(--green); text-align:center; margin-bottom:6px;}
  p.sub{text-align:center; color:#8fae9b; font-size:12px; letter-spacing:.12em; margin-bottom:26px;}
  .grid{display:flex; flex-wrap:wrap; gap:30px; justify-content:center;}
  figure{text-align:center;}
  figcaption{margin-top:10px; font-size:11px; letter-spacing:.18em; color:#8fae9b;}
  /* ---------- cover frame ---------- */
  .cover{
    position:relative; width:340px; height:510px; background:#000;
    border:1px solid #1d2b21; overflow:hidden; flex:none;
    font-family:"Helvetica Neue", Arial, sans-serif;
  }
  .cover svg{position:absolute; inset:0;}
  .cover .frame{position:absolute; inset:14px; border:1.5px solid var(--green-dim); pointer-events:none;}
  .cover .series{
    position:absolute; top:34px; left:0; right:0; text-align:center;
    color:var(--green); font-weight:800; font-size:24px; letter-spacing:.14em; line-height:1.25;
  }
  .cover .series small{display:block; font-size:9.5px; font-weight:600; letter-spacing:.5em; color:var(--pale); margin-bottom:8px;}
  .cover .vol{
    position:absolute; bottom:32px; left:0; right:0; text-align:center; padding:0 22px;
  }
  .cover .vol .no{font-size:10.5px; letter-spacing:.5em; color:var(--pale); margin-bottom:7px;}
  .cover .vol .name{color:var(--green); font-weight:800; font-size:19.5px; letter-spacing:.05em; line-height:1.3; text-transform:uppercase;}
  .cover .rule{width:54px; height:3px; background:var(--green); margin:0 auto 10px;}
</style>
</head>
<body>
<h1 class="page">THE ASHEN DOMINION</h1>
<p class="sub">COVER SYSTEM — BLACK / GREEN · GEOMETRIC · NO ILLUSTRATION</p>

<div class="grid">

<!-- ============ VOLUME 1 : concentric collar rings + price-tag diamond ============ -->
<figure>
<div class="cover">
  <svg viewBox="0 0 340 510">
    <circle cx="170" cy="252" r="98" fill="none" stroke="#2fe07a" stroke-width="3"/>
    <circle cx="170" cy="252" r="76" fill="none" stroke="#15924c" stroke-width="10"/>
    <circle cx="170" cy="252" r="52" fill="none" stroke="#2fe07a" stroke-width="2"/>
    <circle cx="170" cy="252" r="10" fill="#2fe07a"/>
    <line x1="170" y1="118" x2="170" y2="386" stroke="#0a3520" stroke-width="2"/>
    <line x1="36" y1="252" x2="304" y2="252" stroke="#0a3520" stroke-width="2"/>
  </svg>
  <div class="frame"></div>
  <div class="series"><small>THE</small>ASHEN<br>DOMINION</div>
  <div class="vol"><div class="rule"></div><div class="no">VOLUME 1</div><div class="name">Buy Your Own Hero!</div></div>
</div>
<figcaption>VOL.1 — RINGS</figcaption>
</figure>

<!-- ============ VOLUME 2 : planet + orbit ellipses ============ -->
<figure>
<div class="cover">
  <svg viewBox="0 0 340 510">
    <g fill="#2fe07a">
      <circle cx="60" cy="150" r="2"/><circle cx="290" cy="140" r="2.4"/><circle cx="255" cy="345" r="2"/>
      <circle cx="80" cy="330" r="1.8"/><circle cx="305" cy="225" r="1.8"/><circle cx="42" cy="238" r="2.2"/>
      <circle cx="200" cy="128" r="1.6"/><circle cx="128" cy="368" r="1.6"/>
    </g>
    <circle cx="170" cy="252" r="46" fill="#0a3520" stroke="#2fe07a" stroke-width="3"/>
    <circle cx="170" cy="252" r="30" fill="none" stroke="#15924c" stroke-width="2"/>
    <ellipse cx="170" cy="252" rx="118" ry="40" fill="none" stroke="#2fe07a" stroke-width="2.5" transform="rotate(-18 170 252)"/>
    <circle cx="272" cy="216" r="6" fill="#2fe07a"/>
  </svg>
  <div class="frame"></div>
  <div class="series"><small>THE</small>ASHEN<br>DOMINION</div>
  <div class="vol"><div class="rule"></div><div class="no">VOLUME 2</div><div class="name">The Grand Adventure<br>In Space!</div></div>
</div>
<figcaption>VOL.2 — ORBITS</figcaption>
</figure>

<!-- ============ VOLUME 3 : faceted gem / starburst ============ -->
<figure>
<div class="cover">
  <svg viewBox="0 0 340 510">
    <polygon points="170,142 265,307 75,307" fill="none" stroke="#e0322a" stroke-width="3.5"/>
    <polygon points="170,196 218,279 122,279" fill="none" stroke="#e0322a" stroke-width="2"/>
  </svg>
  <div class="frame"></div>
  <div class="series"><small>THE</small>ASHEN<br>DOMINION</div>
  <div class="vol"><div class="rule"></div><div class="no">VOLUME 3</div><div class="name">My First Diva!</div></div>
</div>
<figcaption>VOL.3 — TRIANGLE (RED)</figcaption>
</figure>

<!-- ============ VOLUME 4 : exploded assembly diagram ============ -->
<figure>
<div class="cover">
  <svg viewBox="0 0 340 510">
    <g stroke="#15924c" stroke-width="1.6" stroke-dasharray="5 5">
      <line x1="170" y1="252" x2="112" y2="194"/><line x1="170" y1="252" x2="228" y2="194"/>
      <line x1="170" y1="252" x2="112" y2="310"/>
      <line x1="112" y1="194" x2="228" y2="194"/>
      <line x1="112" y1="194" x2="112" y2="310"/>
    </g>
    <rect x="82" y="164" width="60" height="60" fill="#0a3520" stroke="#2fe07a" stroke-width="3"/>
    <rect x="198" y="164" width="60" height="60" fill="none" stroke="#2fe07a" stroke-width="3"/>
    <rect x="82" y="280" width="60" height="60" fill="none" stroke="#2fe07a" stroke-width="3"/>
    <circle cx="170" cy="252" r="7" fill="#c9ffe0"/>
    <g stroke="#c9ffe0" stroke-width="2.4">
      <line x1="52" y1="140" x2="52" y2="156"/><line x1="44" y1="148" x2="60" y2="148"/>
      <line x1="288" y1="348" x2="288" y2="364"/><line x1="280" y1="356" x2="296" y2="356"/>
    </g>
  </svg>
  <div class="frame"></div>
  <div class="series"><small>THE</small>ASHEN<br>DOMINION</div>
  <div class="vol"><div class="rule"></div><div class="no">VOLUME 4</div><div class="name">Some Assembly<br>Required!</div></div>
</div>
<figcaption>VOL.4 — ASSEMBLY</figcaption>
</figure>

<!-- ============ VOLUME 5 : collection grid ============ -->
<figure>
<div class="cover">
  <svg viewBox="0 0 340 510">
    <g>
      <circle cx="126" cy="208" r="31" fill="#2fe07a"/>
      <circle cx="214" cy="208" r="31" fill="none" stroke="#2fe07a" stroke-width="3"/>
      <circle cx="126" cy="296" r="31" fill="#0a3520" stroke="#15924c" stroke-width="2"/>
      <circle cx="214" cy="296" r="31" fill="none" stroke="#c9ffe0" stroke-width="3" stroke-dasharray="7 6"/>
    </g>
  </svg>
  <div class="frame"></div>
  <div class="series"><small>THE</small>ASHEN<br>DOMINION</div>
  <div class="vol"><div class="rule"></div><div class="no">VOLUME 5</div><div class="name">Collect Them All!</div></div>
</div>
<figcaption>VOL.5 — FOUR RINGS</figcaption>
</figure>

<!-- ============ VOLUME 6 : open ring, segment removed ============ -->
<figure>
<div class="cover">
  <svg viewBox="0 0 340 510">
    <path d="M 244 190 A 92 92 0 1 0 262 268" fill="none" stroke="#2fe07a" stroke-width="13"/>
    <path d="M 244 190 A 92 92 0 1 0 262 268" fill="none" stroke="#0a3520" stroke-width="3"/>
    <g transform="translate(38 44)">
      <path d="M 244 190 A 92 92 0 0 1 262 268" fill="none" stroke="#c9ffe0" stroke-width="13"/>
    </g>
    <g stroke="#15924c" stroke-width="2" stroke-dasharray="4 6">
      <line x1="282" y1="234" x2="306" y2="234"/><line x1="282" y1="270" x2="306" y2="270"/>
    </g>
  </svg>
  <div class="frame"></div>
  <div class="series"><small>THE</small>ASHEN<br>DOMINION</div>
  <div class="vol"><div class="rule"></div><div class="no">VOLUME 6</div><div class="name">It Comes Off!</div></div>
</div>
<figcaption>VOL.6 — OPEN RING</figcaption>
</figure>

</div>
</body>
</html>
