    - "Bog has found a lever on the Mediatoress (ch99): enraged by the collar and the kiss — genuinely angry for the first time, and in her agitation never reaching for the erasure she could have used — she was worked on through her incarnation. At Bog's direction Priya narrated her own fantasies to the entity (how she wants to be fucked, pleasured, dominated and tamed) while Bog kneaded and pulled at the shared body's breasts and belly; Priya first refused, then cooperated to save her family, then participated fully and without shame — stutter gone, first-ever hearts in her speech, pulling at the collar on her own throat. The entity feels what the body feels: her cosmic retorts eroded to a single involuntary sound. The declaration still stands; Rin hung in red light throughout as witness; Nia knows none of it"
    - "Bog has pressed the lever further (ch100): at his order Priya's own hands stripped off the manifested costume under a torrent of the entity's abuse; on his lap, kissed continuously, she sucked his fingers clean and took them inside her. Surfacing mid-act, Priya begged Bog's reassurance that it is right and will protect Arjun and her family, and he gave it. The Mediatoress retracted her ch97 dismissal of the Val aloud — the green ones will be wiped out before humanity, Bog first — and the vow was cut off by the shared body's first full climax, which the entity experienced through the incarnation; the red light holding Rin dipped once at the peak. The retraction was made under duress and stands unconfirmed; the resolution against humanity still stands; Rin watched through her fingers; Nia knows none of it"
    - "The working has continued (ch101): Bog's free hand toured Priya's breasts, thighs and belly — gripping, kneading, twisting, squeezing, praising each part's softness and plenty aloud, the belly his declared favourite — while his fingers and thumb never stopped inside her and at her bud, and Priya and the Mediatoress climaxed repeatedly and together. The Mediatoress named the danger herself ('each surrender of the flesh loosens—'), scrunched her nose, gritted her teeth and tried to endure; Priya counterattacked through the shared mouth, chanting 'Come♥ Come♥ Come♥!!' on the alibi that she is only Bog's instrument and the god is the one being ravished — and climaxed anyway. Rin, still suspended, moaned aloud despite herself, her legs drifting wide, her arousal dripping onto the cavern floor. Nia knows none of it"
    - "The escalation has landed (ch102): at Bog's command ('Time to beg breeding'), Priya stood, spread her legs, parted herself with her own fingers and begged in English-and-Hindi devotional verse — herself in the third person as the servant girl, Bog hailed as Shiva come again, his battering ram begged against the gates of the city — weaving the Mediatoress's rebuttals into the poetry until the entity could not even interrupt. Bog answered with a clumsy Salman Khan imitation that drew a real laugh from her, dipped and kissed her, then hoisted her into the air and penetrated her suspended, gripping her married backside in both hands — their first full coupling, at her invitation. Rin, flushed and flailing, recognised the genre from her mother's viewing and shouted it, openly delighted. Nia knows none of it"
    - "The litany has been spoken (ch103): with Priya suspended and pounded to the opening of her womb, her whole body swaying in counter-rhythm, Bog declared — and both voices answered in turn — that she belongs to him, that she submits, that she is his fourth consort (counted with a glance up at Rin, who swung her fists and shouted 'what a philanderer!'), and that her purpose is not wiping out humanity or the Val but bearing him plenty of heirs. Priya's shameless private note was how vastly different all of it is from Arjun. Resistance ended as pure voice: the entity's 'I cannnn't lose thish♥' against Priya's 'Give in♥ Give in♥', trailing into one sustained vowel. Nia knows none of it — and is still descending toward the sound"
    - "The aftermath is household (ch104): Priya's power faded, the red light vanished, and Rin fell — landing on her bottom, unhurt, tearing up — into total darkness; the Mediatoress seems no longer active, her status (dormant, withdrawn, broken) not established. Bog lingered over an unnecessary kiss, withdrew, laid Priya gently on the floor and stroked her belly in the dark. Rin asked the pregnancy question aloud ('What if she ends up... preg... nant?'); Bog would be happy, though he hears it is not quite that simple. His 'Any dents?' was answered with a middle finger started, reconsidered, and switched for a little finger, raised toward his voice. Called over by his patted thigh, Rin crawled to him on all fours; Priya woke, stammering 'I-I-I want it too...♥', and the slurping in the dark became a duet. Nia is still descending — now toward darkness and quiet"
    - "The tentacle monster has reached the mountain cavern (ch109): mid-ascent it tore through the rock wall with a searchlight, and while Nia armed herself with a stalagmite fragment to fight it, its light settled on Bog and it asked, courteously, 'Are you safe, Commander Bog?' — it has come for its Commander, in the whole party's hearing"
    - "The monster has reported in (ch110): its assigned mission — the training of Sonya — is complete (the chapter leaves it unnamed; Bog never asks); it detected the singularity's energy signature and rushed to its Commander; Val Dominion reconnaissance units are approaching the area. Bog — claiming a 'high-level mission' — ordered it to block all radio communications and switch to stealth mode; the monster confirmed it will cease all transmissions and proceed below the surface itself. Nia's insult ('Did you actually fuck a tentacle monster?') drew an awkward look away from Bog, and she has registered it"
    - "The party is travelling inside the monster (ch111): on Bog's stealth order it burrowed underground, built a living space within its body for the four of them, and retrieved Rin's dead suit at her plea. Aboard, the four have made formal introductions at last (Nia Okonkwo; Dr. Priya Raghavan; Yan Rin), and Nia's consort craving, acute in the enclosed space, was restrained only by main force"
    - "The destination is set and Nia knows the truth (ch112): Bog named Florence, with Priya's return to her family as the first priority. Asked about Dr. Hermes, Priya answered regretfully that he is dead — Nia's journey's goal is gone, and Bog, almost pleased, declared the collar research starts from scratch. The monster then extended a tentacle fitted with a collar and offered to show Bog how to use the 'General Control System' if he has a toolkit of Class 2 or higher"
    - "The collar is a General Control System (ch113): the monster never mentioned the toolkit because 'I wasn't asked'; it teaches only on Bog's order, which he has given (teach Nia; answer their questions). Removal done correctly will not explode — what is lost is access to the System's 'basic functions': communication, sensory synchronization, remote control, loyalty monitoring, power conservation, storage, amplification, bursts, resonance. The monster confirmed Rin's deduction: the System can amplify a hero's power and trigger a burst. It addressed Rin as 'presumed consort'"
    - "The toolkit is on Bog's arm (ch114): only a Val can use a Class 5 toolkit — Nia cannot, 'not yet' — and powers can be restored, amplified or burst by settings alone; the collars are in accumulation mode and the stored power will not short-circuit. Bog fumbled the setup until Rin guided his hands; the toolkit transformed and snapped onto his forearm as a wristband that cannot be removed ('standard equipment for a Commander')"
    - "Loyalty ratings displayed (ch115): at Bog's command the collars projected their loyalty ratings — Val script first, then, at Nia's demand, Earth percentages: Nia 93%, Rin 18%, Priya 12%, all in everyone's sight"
    - "The first collar settings change has been made — on Rin, at her own eager request (ch116): Nia had just denounced the loyalty assessment as 'a load of bullshit' when Rin begged to try amplification and a burst before anyone removes a collar. Under amplification her hair stood crackling and her mechanical insight sharpened until she grasped her collar's construction — and the monster's ('the same thinking') — crying that she could make an incredible suit out of it; per the user's ruling, part of that understanding remains in her afterwards, akin to a flash of insight — though whether she truly grasps the whole picture is uncertain, and her confidence outruns her verified grasp. The ruling also names her a wild card: the full unleashing of her superpower would be catastrophic for the machine-based civilizations of both Val and humanity (whether it ever comes to pass is undecided). The burst then surged across her body — and her own power interfered with Nia's and Priya's collars, which flared though no command had touched them; the monster rumbled: 'Warning: external control has been established'. (User correction, 2026-11-20: NOT the System's resonance function — Rin's superpower interfering. At its maximum she could control collars outright, overriding and hijacking toolkit control; the warning registered her interference. Nobody in the room knows any of this, Rin included.) After the discharge Rin collapsed; the monster's account: she has exhausted her stored power"
    - "Priya has flown as herself (ch117): Bog, dodging Nia's glare after the exhausted Rin visibly craved him and refused herself, volunteered Priya for Amplification over her terrified refusal and commanded it. She rose clutching her backside, bumped her head on the living quarters' ceiling, parted the monster's wall to make an exit (the monster reported an 'inexplicable external interference with its own body'), lit the subterranean hollow red, looped joyfully in front of the monster, then restored the wall and landed. The Red Mediatoress did not awaken, stir or speak at any point: the power was Priya's own, amplified — her first free use of it. Burst was proposed but never commanded"
    - "The collars have started coming off (ch118): Bog, mid-relief, realised the vintage collars are not the restraints the Elites think but weapons — any collared hero still alive in Dominion hands holds, in effect, a charged energy rifle with the safety on (new thread T17; he has told no one in authority). Beaming, he removed Rin's and Priya's collars with the toolkit — safe, instant, the first removals in the story. Both women kept their collars as objects: Rin to study hers, Priya for its communication function. Offered her own removal, Nia declined — smiling, tracing the collar: she will keep wearing it 'for a little while longer', reasons unstated — and Bog let it stand"
    - "The party has surfaced (ch119): while they slept, the monster travelled beyond the Dominion reconnaissance units' search radius, surfaced to rest, showered them with filtered warm groundwater, and wards off biting insects with sound waves. On its back in the sun, the three women talked families: Priya committed the Free Clinics network (which carries names and lists of the missing and found, and confirmed her own parents alive) to the search for Nia's Daniel, Amara and Chidi; Rin added the Old Guards' records, shared her own losses (parents dead at Vesper; grandparents in Chengdu uncontacted since the war) and named Darkwing her true family now. None of the three mentioned Bog, or what he has done to each of them"
    - "Sonya is aboard the monster (ch119; user ruling 2026-11-20): she has been inside it, in a sealed compartment grown in its flesh, since it came to the mountain — the earlier record that she stayed in the Burrow is superseded. Summoned to inspect the assigned mission's results, Bog found her mid-regimen (see her physical_state) — he had forgotten her entirely — heard out her hoarded torrent of Russian threats (one involuntary '♥' slipping out mid-threat), and ordered the regimen continued: 'keep it up'. Nia, metres away in the sun, knows none of it"
    - "The household record is opened (ch122, parallel to ch120): while Nia prosecuted Bog at the tree, the monster — its records incomplete without their stations — formally received Rin and Priya on its back. Rin tentatively stated 'third' and Priya murmured 'fourth'; it logged both, encouraged them to grow into fine consorts who will bear Bog many offspring, assessed Rin as still a little too slender for breeding (she must eat more) and Priya's body as well suited to pregnancy (to be maintained), then fed them a composition mimicking Bog's seminal fluid through thick tubes — both women, ashamed and neither refusing, crouching on their heels with legs spread at its direction, mouths filled completely — while appendages shaped as Bog's exact hands stroked their heads. Its closing log: 'Third Consort: eating well. Fourth Consort: maintaining. Both will do very well.' It did not mention the second consort it keeps below"
